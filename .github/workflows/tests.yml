name: Tests

# Runs on every push and every pull request, on any branch.
# No branch filter: this repo's branch names are generated, not fixed.
on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first one.
      fail-fast: false
      matrix:
        # README advertises Python 3.9+; the matrix is what verifies that.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the test suite
        run: python -m pytest tests/ -v

      - name: Smoke-test the CLI
        # Catches breakage in argument parsing, printing and CSV output that
        # the unit tests do not cover.
        run: |
          python fbs_ranker.py --demo
          python fbs_ranker.py demo_games.csv --output /tmp/rankings.csv
          test -s /tmp/rankings.csv
